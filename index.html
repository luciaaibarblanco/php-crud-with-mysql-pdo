<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD con API en PHP + PDO MySQL</title>
    <link rel="stylesheet" href="index.css" />
    <script defer src="index.js"></script>
  </head>

  <body>
    <header>CRUD con API en PHP + PDO MySQL</header>

    <main>
      <div class="row">
        <div class="col">
          <h3>Listar todos los libros</h3>
          <form id="getAllForm">
            <button type="submit">Ejecutar</button>
            <table class="info">
              <thead>
                <tr>
                  <th>Id</th>
                  <th>Título</th>
                  <th>Autor</th>
                  <th>Precio</th>
                </tr>
              </thead>
              <tbody id="getAllInfo"></tbody>
            </table>
          </form>
        </div>
      </div>

      <div class="row">
        <div class="col">
          <h3>Obtener información de un libro</h3>
          <form id="getByIdForm">
            <input type="number" value="" name="id" placeholder="id" />
            <button type="submit">Ejecutar</button>
            <div class="info" id="getByIdInfo"></div>
          </form>
        </div>
      </div>

      <div class="row">
        <div class="col">
          <h3>Agregar libro</h3>
          <form id="addForm">
            <input type="text" value="" name="titulo" placeholder="titulo" />
            <input type="text" value="" name="autor" placeholder="autor" />
            <input type="text" value="" name="precio" placeholder="precio" />
            <button type="submit">Ejecutar</button>
            <div class="info" id="addInfo"></div>
          </form>
        </div>

        <div class="col">
          <h3>Actualizar libro</h3>
          <form id="updateForm">
            <input type="number" value="" name="id" placeholder="id" />
            <input type="text" value="" name="titulo" placeholder="titulo" />
            <input type="text" value="" name="autor" placeholder="autor" />
            <input type="text" value="" name="precio" placeholder="precio" />
            <button type="submit">Ejecutar</button>
            <div class="info" id="updateInfo"></div>
          </form>
        </div>

        <div class="col">
          <h3>Eliminar libro</h3>
          <form id="deleteForm">
            <input type="hidden" name="accion" value="delete" />
            <input type="number" value="" name="id" placeholder="id" />
            <button type="button" id="deleteFormSubmitButton">Ejecutar</button>
            <div class="info" id="deleteInfo"></div>
          </form>
        </div>
      </div>
    </main>

    <footer>
      <a href="https://www.luciaaibarblanco.com" target="_blank">www.luciaaibarblanco.com</a>
    </footer>
  </body>
</html>
